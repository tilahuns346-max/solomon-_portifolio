  </defs>
  <rect width="800" height="500" rx="16" fill="url(#pBg)"/>
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#111827" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
