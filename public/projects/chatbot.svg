<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#1e293b" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
  <text x="400" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">AI Smart Chatbot • React &amp; Django Engine</text>

  <!-- Chat container -->
  <rect x="120" y="90" width="560" height="380" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Header of chat -->
  <rect x="120" y="90" width="560" height="60" rx="12" fill="#0f172a"/>
  <circle cx="160" cy="120" r="16" fill="url(#botGrad)"/>
  <path d="M152 118h16M156 114v8M164 114v8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="190" y="117" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold">Django AI Assistant</text>
  <circle cx="193" cy="130" r="4" fill="#10b981"/>
  <text x="203" y="133" fill="#10b981" font-family="system-ui" font-size="11">Online • Instant Response</text>

  <!-- Bot Bubble 1 -->
  <rect x="150" y="170" width="340" height="50" rx="10" fill="#334155"/>
  <text x="165" y="195" fill="#f1f5f9" font-family="system-ui" font-size="13">Hello Solomon! How can I assist you with</text>
  <text x="165" y="211" fill="#f1f5f9" font-family="system-ui" font-size="13">your software engineering tasks today?</text>

  <!-- User Bubble 1 -->
  <rect x="360" y="235" width="290" height="42" rx="10" fill="#06b6d4"/>
  <text x="375" y="260" fill="#042f2e" font-family="system-ui" font-size="13" font-weight="600">Explain Django REST API authentication flow.</text>

  <!-- Bot Bubble 2 -->
  <rect x="150" y="290" width="400" height="85" rx="10" fill="#334155"/>
  <text x="165" y="315" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">Django REST Token / JWT Workflow:</text>
  <text x="165" y="335" fill="#cbd5e1" font-family="system-ui" font-size="12">1. Client sends credentials to /api/token/</text>
  <text x="165" y="353" fill="#cbd5e1" font-family="system-ui" font-size="12">2. Django validates &amp; issues signed Access &amp; Refresh tokens</text>

  <!-- Input bar -->
  <rect x="140" y="395" width="520" height="50" rx="25" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="165" y="425" fill="#64748b" font-family="system-ui" font-size="13">Type your prompt here...</text>
  <circle cx="630" cy="420" r="16" fill="#10b981"/>
  <path d="M625 420l8-4-8-4v8z" fill="#ffffff"/>
</svg>
