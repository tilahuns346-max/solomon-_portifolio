<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#b20710"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#nfBg)"/>
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#1f1f1f" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
  <text x="400" y="54" fill="#8c8c8c" font-family="system-ui" font-size="12" text-anchor="middle">Netflix Streaming Platform UI • React, Node.js &amp; TMDB API</text>

  <!-- Netflix Logo & Nav -->
  <text x="60" y="115" fill="#e50914" font-family="Impact, Arial Black, sans-serif" font-size="28" letter-spacing="1">NETFLIX</text>
  <text x="180" y="112" fill="#e5e5e5" font-family="system-ui" font-size="13">Home</text>
  <text x="240" y="112" fill="#aaa" font-family="system-ui" font-size="13">TV Shows</text>
  <text x="320" y="112" fill="#aaa" font-family="system-ui" font-size="13">Movies</text>
  <text x="390" y="112" fill="#aaa" font-family="system-ui" font-size="13">New &amp; Popular</text>

  <!-- Hero Billboard -->
  <g transform="translate(60, 140)">
    <rect width="680" height="180" rx="8" fill="#221f1f" stroke="#333" stroke-width="1"/>
    <!-- Background overlay visual -->
    <rect x="0" y="0" width="680" height="180" rx="8" fill="url(#redGrad)" opacity="0.15"/>
    <text x="35" y="55" fill="#ffffff" font-family="system-ui" font-size="28" font-weight="900">STRANGER TECH</text>
    <text x="35" y="85" fill="#d1d5db" font-family="system-ui" font-size="13">A gripping full-stack odyssey powered by React, Node.js and MySQL.</text>
    <text x="35" y="105" fill="#d1d5db" font-family="system-ui" font-size="13">Dynamic trailer fetching, user watchlist, and seamless playback.</text>

    <rect x="35" y="125" width="105" height="36" rx="4" fill="#ffffff"/>
    <text x="87" y="148" fill="#000000" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">▶ Play</text>

    <rect x="150" y="125" width="125" height="36" rx="4" fill="#6b7280" opacity="0.8"/>
    <text x="212" y="148" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">ℹ More Info</text>
  </g>

  <!-- Trending Row -->
  <text x="60" y="355" fill="#ffffff" font-family="system-ui" font-size="15" font-weight="bold">Trending Now</text>
  <g transform="translate(60, 370)">
    <rect x="0" y="0" width="125" height="85" rx="6" fill="#2b2b2b" stroke="#404040" stroke-width="1"/>
    <rect x="140" y="0" width="125" height="85" rx="6" fill="#2b2b2b" stroke="#404040" stroke-width="1"/>
    <rect x="280" y="0" width="125" height="85" rx="6" fill="#2b2b2b" stroke="#404040" stroke-width="1"/>
    <rect x="420" y="0" width="125" height="85" rx="6" fill="#2b2b2b" stroke="#404040" stroke-width="1"/>
    <rect x="560" y="0" width="120" height="85" rx="6" fill="#2b2b2b" stroke="#404040" stroke-width="1"/>
  </g>
</svg>
