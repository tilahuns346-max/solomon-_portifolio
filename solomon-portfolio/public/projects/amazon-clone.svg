<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="amzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="dealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#amzBg)"/>
  <!-- Top bar -->
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#131921" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
  <text x="400" y="54" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="middle">Amazon E-Commerce Platform • React, Node.js, Stripe, MySQL</text>

  <!-- Amazon Nav header -->
  <g transform="translate(40, 85)">
    <rect width="720" height="50" rx="6" fill="#131921"/>
    <text x="25" y="32" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="900">amazon<tspan fill="#f59e0b">.clone</tspan></text>
    
    <!-- Search bar -->
    <rect x="180" y="10" width="400" height="30" rx="4" fill="#ffffff"/>
    <text x="200" y="30" fill="#64748b" font-family="system-ui" font-size="12">Search high-performance developer laptops, gadgets...</text>
    <rect x="545" y="10" width="35" height="30" rx="4" fill="#febd69"/>
    <circle cx="562" cy="25" r="5" stroke="#131921" stroke-width="2" fill="none"/>

    <!-- Cart -->
    <rect x="620" y="12" width="80" height="26" rx="4" fill="#232f3e"/>
    <text x="645" y="29" fill="#f59e0b" font-family="system-ui" font-size="12" font-weight="bold">Cart (3)</text>
  </g>

  <!-- Product Cards Grid -->
  <g transform="translate(40, 155)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="225" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="195" height="130" rx="6" fill="#0f172a"/>
    <circle cx="112" cy="80" r="30" fill="#38bdf8" opacity="0.3"/>
    <text x="15" y="170" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold">Pro Developer Laptop M3</text>
    <text x="15" y="195" fill="#f59e0b" font-family="system-ui" font-size="13">★★★★★ <tspan fill="#94a3b8">(420)</tspan></text>
    <text x="15" y="225" fill="#10b981" font-family="system-ui" font-size="20" font-weight="bold">$1,299</text>
    <rect x="15" y="245" width="195" height="36" rx="6" fill="url(#dealGrad)"/>
    <text x="112" y="268" fill="#111827" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Card 2 -->
    <rect x="247" y="0" width="225" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="262" y="15" width="195" height="130" rx="6" fill="#0f172a"/>
    <circle cx="359" cy="80" r="30" fill="#10b981" opacity="0.3"/>
    <text x="262" y="170" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold">Mechanical Keyboard RGB</text>
    <text x="262" y="195" fill="#f59e0b" font-family="system-ui" font-size="13">★★★★★ <tspan fill="#94a3b8">(880)</tspan></text>
    <text x="262" y="225" fill="#10b981" font-family="system-ui" font-size="20" font-weight="bold">$129</text>
    <rect x="262" y="245" width="195" height="36" rx="6" fill="url(#dealGrad)"/>
    <text x="359" y="268" fill="#111827" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Card 3 -->
    <rect x="495" y="0" width="225" height="300" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="510" y="15" width="195" height="130" rx="6" fill="#0f172a"/>
    <circle cx="607" cy="80" r="30" fill="#a855f7" opacity="0.3"/>
    <text x="510" y="170" fill="#f8fafc" font-family="system-ui" font-size="14" font-weight="bold">UltraWide 4K Monitor 34"</text>
    <text x="510" y="195" fill="#f59e0b" font-family="system-ui" font-size="13">★★★★☆ <tspan fill="#94a3b8">(312)</tspan></text>
    <text x="510" y="225" fill="#10b981" font-family="system-ui" font-size="20" font-weight="bold">$549</text>
    <rect x="510" y="245" width="195" height="36" rx="6" fill="url(#dealGrad)"/>
    <text x="607" y="268" fill="#111827" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Add to Cart</text>
  </g>
</svg>
