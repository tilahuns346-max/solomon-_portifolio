<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#skyGrad)"/>
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#1e293b" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
  <text x="400" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Live Weather Forecast • React + OpenWeather API</text>

  <!-- Weather Card Main -->
  <rect x="70" y="100" width="380" height="340" rx="16" fill="#1e293b" opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="145" fill="#f8fafc" font-family="system-ui" font-size="28" font-weight="bold">Addis Ababa, ET</text>
  <text x="100" y="170" fill="#94a3b8" font-family="system-ui" font-size="14">Sunny &amp; Breezy • Friday</text>
  
  <circle cx="150" cy="245" r="38" fill="url(#sunGrad)"/>
  <text x="220" y="260" fill="#ffffff" font-family="system-ui" font-size="64" font-weight="bold">24°C</text>
  
  <rect x="100" y="325" width="90" height="80" rx="10" fill="#0f172a"/>
  <text x="145" y="352" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">HUMIDITY</text>
  <text x="145" y="380" fill="#38bdf8" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">48%</text>

  <rect x="205" y="325" width="90" height="80" rx="10" fill="#0f172a"/>
  <text x="250" y="352" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">WIND</text>
  <text x="250" y="380" fill="#10b981" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">14 km/h</text>

  <rect x="310" y="325" width="90" height="80" rx="10" fill="#0f172a"/>
  <text x="355" y="352" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="middle">PRESSURE</text>
  <text x="355" y="380" fill="#eab308" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">1014hPa</text>

  <!-- Right Weekly Card -->
  <rect x="475" y="100" width="255" height="340" rx="16" fill="#1e293b" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="500" y="135" fill="#f8fafc" font-family="system-ui" font-size="16" font-weight="bold">7-Day Forecast</text>

  <!-- Forecast items -->
  <g transform="translate(500, 155)">
    <text x="0" y="20" fill="#cbd5e1" font-family="system-ui" font-size="13">Sat</text>
    <circle cx="80" cy="16" r="8" fill="#fbbf24"/>
    <text x="190" y="20" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold">23° / 14°</text>
  </g>
  <g transform="translate(500, 205)">
    <text x="0" y="20" fill="#cbd5e1" font-family="system-ui" font-size="13">Sun</text>
    <circle cx="80" cy="16" r="8" fill="#38bdf8"/>
    <text x="190" y="20" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold">21° / 13°</text>
  </g>
  <g transform="translate(500, 255)">
    <text x="0" y="20" fill="#cbd5e1" font-family="system-ui" font-size="13">Mon</text>
    <circle cx="80" cy="16" r="8" fill="#fbbf24"/>
    <text x="190" y="20" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold">25° / 15°</text>
  </g>
  <g transform="translate(500, 305)">
    <text x="0" y="20" fill="#cbd5e1" font-family="system-ui" font-size="13">Tue</text>
    <circle cx="80" cy="16" r="8" fill="#a855f7"/>
    <text x="190" y="20" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold">22° / 13°</text>
  </g>
  <g transform="translate(500, 355)">
    <text x="0" y="20" fill="#cbd5e1" font-family="system-ui" font-size="13">Wed</text>
    <circle cx="80" cy="16" r="8" fill="#fbbf24"/>
    <text x="190" y="20" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold">24° / 14°</text>
  </g>
</svg>
