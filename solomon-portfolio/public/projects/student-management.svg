<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#1e293b" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
  <rect x="250" y="40" width="300" height="20" rx="6" fill="#334155" />
  <text x="400" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Student Management System • Dashboard</text>
  
  <!-- Dashboard UI Mockup -->
  <!-- Sidebar -->
  <rect x="30" y="80" width="180" height="390" fill="#0f172a" rx="4" />
  <rect x="50" y="105" width="140" height="28" rx="6" fill="#10b981" opacity="0.2" />
  <rect x="65" y="113" width="70" height="12" rx="3" fill="#10b981" />
  <rect x="50" y="145" width="140" height="20" rx="4" fill="#1e293b" />
  <rect x="50" y="175" width="140" height="20" rx="4" fill="#1e293b" />
  <rect x="50" y="205" width="140" height="20" rx="4" fill="#1e293b" />
  <rect x="50" y="235" width="140" height="20" rx="4" fill="#1e293b" />

  <!-- Main Content -->
  <!-- Stats Cards -->
  <rect x="230" y="90" width="165" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="250" y="118" fill="#94a3b8" font-family="system-ui" font-size="12">Total Students</text>
  <text x="250" y="152" fill="#10b981" font-family="system-ui" font-size="28" font-weight="bold">1,420</text>
  
  <rect x="415" y="90" width="165" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="435" y="118" fill="#94a3b8" font-family="system-ui" font-size="12">Active Courses</text>
  <text x="435" y="152" fill="#06b6d4" font-family="system-ui" font-size="28" font-weight="bold">48</text>

  <rect x="600" y="90" width="170" height="85" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="620" y="118" fill="#94a3b8" font-family="system-ui" font-size="12">Attendance Rate</text>
  <text x="620" y="152" fill="#a855f7" font-family="system-ui" font-size="28" font-weight="bold">94.8%</text>

  <!-- Table Preview -->
  <rect x="230" y="195" width="540" height="275" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="250" y="215" width="500" height="30" rx="6" fill="#334155" opacity="0.6"/>
  <text x="270" y="235" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">STUDENT NAME</text>
  <text x="450" y="235" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">DEPARTMENT</text>
  <text x="630" y="235" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">STATUS</text>

  <!-- Row 1 -->
  <circle cx="275" cy="275" r="12" fill="#10b981" opacity="0.4"/>
  <rect x="295" y="268" width="110" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="450" y="268" width="120" height="14" rx="4" fill="#64748b"/>
  <rect x="630" y="265" width="65" height="20" rx="10" fill="#059669"/>
  <text x="643" y="279" fill="#ecfdf5" font-family="system-ui" font-size="10" font-weight="bold">Active</text>

  <!-- Row 2 -->
  <circle cx="275" cy="325" r="12" fill="#06b6d4" opacity="0.4"/>
  <rect x="295" y="318" width="130" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="450" y="318" width="95" height="14" rx="4" fill="#64748b"/>
  <rect x="630" y="315" width="65" height="20" rx="10" fill="#059669"/>
  <text x="643" y="329" fill="#ecfdf5" font-family="system-ui" font-size="10" font-weight="bold">Active</text>

  <!-- Row 3 -->
  <circle cx="275" cy="375" r="12" fill="#f59e0b" opacity="0.4"/>
  <rect x="295" y="368" width="100" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="450" y="368" width="110" height="14" rx="4" fill="#64748b"/>
  <rect x="630" y="365" width="65" height="20" rx="10" fill="#d97706"/>
  <text x="640" y="379" fill="#fffbeb" font-family="system-ui" font-size="10" font-weight="bold">Pending</text>

  <!-- Row 4 -->
  <circle cx="275" cy="425" r="12" fill="#8b5cf6" opacity="0.4"/>
  <rect x="295" y="418" width="125" height="14" rx="4" fill="#cbd5e1"/>
  <rect x="450" y="418" width="130" height="14" rx="4" fill="#64748b"/>
  <rect x="630" y="415" width="65" height="20" rx="10" fill="#059669"/>
  <text x="643" y="429" fill="#ecfdf5" font-family="system-ui" font-size="10" font-weight="bold">Active</text>
</svg>
