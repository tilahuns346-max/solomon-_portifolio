<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cafeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#cafeBg)"/>
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#292524" />
  <circle cx="55" cy="50" r="6" fill="#ef4444" />
  <circle cx="75" cy="50" r="6" fill="#eab308" />
  <circle cx="95" cy="50" r="6" fill="#10b981" />
  <text x="400" y="54" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Cafe POS &amp; Order Management • React + Django</text>

  <!-- Left: Menu items grid -->
  <g transform="translate(45, 90)">
    <rect width="420" height="375" rx="12" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
    <text x="25" y="35" fill="#f5f5f4" font-family="system-ui" font-size="16" font-weight="bold">Point of Sale - Active Menu</text>
    
    <!-- Item 1 -->
    <rect x="25" y="55" width="175" height="95" rx="8" fill="#292524" stroke="#d97706" stroke-width="1.5"/>
    <text x="40" y="85" fill="#fafaf9" font-family="system-ui" font-size="14" font-weight="bold">Espresso Roast</text>
    <text x="40" y="105" fill="#a8a29e" font-family="system-ui" font-size="12">Double Shot Pure</text>
    <text x="40" y="132" fill="#10b981" font-family="system-ui" font-size="15" font-weight="bold">$3.50</text>

    <!-- Item 2 -->
    <rect x="220" y="55" width="175" height="95" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="235" y="85" fill="#fafaf9" font-family="system-ui" font-size="14" font-weight="bold">Caramel Latte</text>
    <text x="235" y="105" fill="#a8a29e" font-family="system-ui" font-size="12">Oat milk &amp; syrup</text>
    <text x="235" y="132" fill="#10b981" font-family="system-ui" font-size="15" font-weight="bold">$5.25</text>

    <!-- Item 3 -->
    <rect x="25" y="165" width="175" height="95" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="40" y="195" fill="#fafaf9" font-family="system-ui" font-size="14" font-weight="bold">Mocha Frappe</text>
    <text x="40" y="215" fill="#a8a29e" font-family="system-ui" font-size="12">Whipped cream</text>
    <text x="40" y="242" fill="#10b981" font-family="system-ui" font-size="15" font-weight="bold">$5.75</text>

    <!-- Item 4 -->
    <rect x="220" y="165" width="175" height="95" rx="8" fill="#292524" stroke="#44403c" stroke-width="1"/>
    <text x="235" y="195" fill="#fafaf9" font-family="system-ui" font-size="14" font-weight="bold">Croissant Butter</text>
    <text x="235" y="215" fill="#a8a29e" font-family="system-ui" font-size="12">Freshly baked</text>
    <text x="235" y="242" fill="#10b981" font-family="system-ui" font-size="15" font-weight="bold">$4.00</text>
  </g>

  <!-- Right: Cart & Order Receipt -->
  <g transform="translate(485, 90)">
    <rect width="270" height="375" rx="12" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
    <text x="25" y="35" fill="#f5f5f4" font-family="system-ui" font-size="16" font-weight="bold">Current Order #148</text>
    <rect x="25" y="55" width="220" height="1" fill="#44403c"/>

    <text x="25" y="85" fill="#e7e5e4" font-family="system-ui" font-size="13">1x Espresso Roast</text>
    <text x="215" y="85" fill="#e7e5e4" font-family="system-ui" font-size="13" text-anchor="end">$3.50</text>

    <text x="25" y="120" fill="#e7e5e4" font-family="system-ui" font-size="13">2x Caramel Latte</text>
    <text x="215" y="120" fill="#e7e5e4" font-family="system-ui" font-size="13" text-anchor="end">$10.50</text>

    <text x="25" y="155" fill="#e7e5e4" font-family="system-ui" font-size="13">1x Croissant Butter</text>
    <text x="215" y="155" fill="#e7e5e4" font-family="system-ui" font-size="13" text-anchor="end">$4.00</text>

    <rect x="25" y="185" width="220" height="1" fill="#44403c"/>
    <text x="25" y="220" fill="#a8a29e" font-family="system-ui" font-size="14">Subtotal</text>
    <text x="215" y="220" fill="#a8a29e" font-family="system-ui" font-size="14" text-anchor="end">$18.00</text>
    <text x="25" y="250" fill="#f59e0b" font-family="system-ui" font-size="18" font-weight="bold">Total Due</text>
    <text x="215" y="250" fill="#10b981" font-family="system-ui" font-size="20" font-weight="bold" text-anchor="end">$19.80</text>

    <rect x="25" y="295" width="220" height="48" rx="8" fill="url(#amberGrad)"/>
    <text x="135" y="325" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">Charge &amp; Print Bill</text>
  </g>
</svg>
